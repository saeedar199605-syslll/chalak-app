<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>سامانه ارزیابی عملکرد و مربیگری اصفهان چالاک</title>
    
    <!-- High-Performance Persian Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      // Suppress benign Vite WebSocket / HMR sandbox disconnection logs and rejections
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var str = String(event.reason) + ' ' + String(event.reason.message || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message) {
          var msg = String(event.message);
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      }, true);

      // Automatic fallback if user opens index.html directly via file:// protocol without running Vite server
      if (window.location.protocol === 'file:') {
        window.location.href = './Start-Offline-App.html';
      }
    </script>
  </head>
  <body class="antialiased selection:bg-teal-500/20 selection:text-teal-300">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
